[package]
name = "portal-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
portal-service = { path = "../portal-service" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
tray-icon = { version = "=0.19.2", default-features = false }
muda = { version = "=0.15.3", default-features = false }
windows = { version = "=0.58.0", features = ["Foundation", "Foundation_Collections", "Data_Xml_Dom", "UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security"] }

[[bin]]
name = "portal-tray"
path = "src/bin/tray.rs"

[[bin]]
name = "portal-settings"
path = "src/bin/settings.rs"
