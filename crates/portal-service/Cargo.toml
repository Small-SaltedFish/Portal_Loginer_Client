[package]
name = "portal-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
portal-core = { path = "../portal-core" }
portal-update = { path = "../portal-update" }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.0"
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Services",
  "Win32_UI_Shell", "Win32_System_Com",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock"
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
